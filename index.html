<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Grafick · Caja</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#17181a;--mu:#6b6e73;--ln:#dcdad2;--c:#0077b6;--m:#c2185b;--y:#f2b705;--ok:#1b7f4b;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--sf:#1e2023;--tx:#ececea;--mu:#9a9da3;--ln:#33363a;--c:#4cb3e6;--m:#ee6a9b;--y:#f5c940;--ok:#58c58a;--bad:#ff7b72}}
:root[data-theme="dark"]{--bg:#141517;--sf:#1e2023;--tx:#ececea;--mu:#9a9da3;--ln:#33363a;--c:#4cb3e6;--m:#ee6a9b;--y:#f5c940;--ok:#58c58a;--bad:#ff7b72}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 12px;font-size:13px}
.bar{height:5px;display:flex;margin-bottom:10px}.bar i{flex:1}.bar i:nth-child(1){background:var(--c)}.bar i:nth-child(2){background:var(--m)}.bar i:nth-child(3){background:var(--y)}.bar i:nth-child(4){background:var(--tx)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:1;min-width:60px;padding:9px 6px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;font:inherit;font-weight:600}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:16px;margin:0 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .w{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit}button:disabled{opacity:.4}
button.p{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600;width:100%}
button.s{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:7px;padding:6px 10px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);align-items:center}
.row:first-of-type{border-top:0}
.mu{color:var(--mu);font-size:13px}.r{text-align:right}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid}
.ok{color:var(--ok)}.bad{color:var(--bad)}.void{text-decoration:line-through;opacity:.5}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{border:1px solid var(--ln);border-radius:8px;padding:8px;background:var(--sf)}.kpi b{display:block;font-size:17px}
.ag{border-left:4px solid var(--m)}.ag p{margin:4px 0}
.lock{border-left:4px solid var(--y)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-top:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}
.sc{overflow-x:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#rc{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#rc>div{background:var(--sf);border-radius:10px;padding:16px;max-width:380px;width:100%;max-height:90%;overflow:auto}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,monospace;margin:0 0 10px}
@media print{body>*:not(#rc){display:none!important}#rc{position:static;background:none;display:block!important}#rc button,#rc a{display:none}}
.hd{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--ln);margin-bottom:8px;color:#17181a}.hd img{display:block;max-width:280px;width:75%;height:auto;margin:0 auto}.mb{text-align:center;font-size:12px;line-height:1.7;margin-top:6px}.mb span{display:inline-flex;align-items:center;gap:4px;margin:0 8px;white-space:nowrap}.mb svg{width:15px;height:15px;flex:none}

(()=>{let role="",P=null;const T=()=>sessionStorage.getItem("tk")||"";
async function api(p,o={}){const r=await fetch(p,{...o,headers:{"Content-Type":"application/json","x-token":T()}});if(r.status===401){sessionStorage.clear();location.reload();throw{message:"Sesión vencida"}}if(!r.ok)throw{message:(await r.json()).e||"Error"};return r.json()}
function ask(){return new Promise(ok=>{if(T()){role=sessionStorage.getItem("rl");return ok()}const d=document.createElement("div");d.style="position:fixed;inset:0;background:#f6f5f1;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif";
d.innerHTML='<form style="max-width:300px;width:100%"><h2>Ingresar a la caja</h2><input type="password" inputmode="numeric" placeholder="PIN" style="width:100%;padding:12px;font-size:18px;margin:8px 0"><button style="width:100%;padding:12px;font-size:16px">Entrar</button><p style="color:#c62828"></p></form>';document.body.appendChild(d);
d.querySelector("form").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:d.querySelector("input").value})}),o=await r.json();
if(!r.ok){d.querySelector("p").textContent=o.e;return}sessionStorage.setItem("tk",o.token);sessionStorage.setItem("rl",o.role);role=o.role;d.remove();ok()}})}
const subs=[];let last={};async function poll(){try{const x=await api("/api/state");subs.forEach(f=>f(x))}catch(e){}}
const db={collection:()=>({onSnapshot(cb){let l="";subs.push(x=>{const j=JSON.stringify(x.days);if(j!==l){l=j;cb({docs:Object.entries(x.days).map(([id,data])=>({id,data:()=>data}))})}});poll();setInterval(poll,5000)}}),
doc:p=>({set:d=>api(p.startsWith("caja/")?"/api/day/"+encodeURIComponent(p.slice(5)):"/api/conf",{method:"PUT",body:JSON.stringify(d)}),onSnapshot(cb){let l="";subs.push(x=>{const j=JSON.stringify(x.conf);if(j!==l&&x.conf){l=j;cb({exists:true,data:()=>x.conf})}})}})};
window.claude={use:async n=>{if(n==="user"){await ask();return{canEdit:()=>role==="admin"}}if(n==="db")return db;
if(n==="downloads")return{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=filename;a.click()}};return null}}})();

<script>
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],EST=["Recibido","En producción","Listo","Entregado"],MT=["Efectivo","Tarjeta","Transferencia"];
const SV0=[{n:"Impresión",p:45,u:"m²"},{n:"Vinil adhesivo",p:80,u:"m²"},{n:"Vinil Mesh",p:160,u:"m²"},{n:"Lona backlight",p:160,u:"m²"},{n:"Argolla",p:1.5,u:"unidad"},{n:"Diseño gráfico",p:35,u:"diseño"}];
const q=n=>"Q"+(+n).toFixed(2),r2=n=>Math.round(n*100)/100,esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=()=>({open:"",count:"",closed:false,sales:[],exp:[],log:[]});
let D=Object.fromEntries(DAYS.map(d=>[d,mk()])),SV=SV0.map(x=>({...x})),IV={mode:"incluido",r:12},db=null,admin=true,role="Administrador",cart=[],cur=Math.max(0,Math.min(5,new Date().getDay()-1));
const $=id=>document.getElementById(id);
const day=()=>D[DAYS[cur]],lock=()=>day().closed;
function persist(n){const d=D[n];if(db)db.doc("caja/"+n).set(d).catch(e=>alert("No se pudo guardar: "+(e.message||e.code)));else try{localStorage.setItem("caja2",JSON.stringify(D))}catch(e){}}
function savePrices(){if(db)db.doc("conf/precios").set({p:SV,iv:IV}).catch(()=>{});else try{localStorage.setItem("caja2p",JSON.stringify({p:SV,iv:IV}))}catch(e){}}
function lg(d,t){d.log.push({t,r:role,h:new Date().toLocaleTimeString("es-GT",{hour:"2-digit",minute:"2-digit"})})}
const ap=s=>s.apr||"ok",apt=(d,k)=>r2(act(d).filter(x=>ap(x)===k).reduce((a,x)=>a+x.total,0)),paid=s=>r2(s.pay.reduce((a,p)=>a+p.a,0)),act=d=>d.sales.filter(s=>!s.void);
function byM(d){const o={Efectivo:0,Tarjeta:0,Transferencia:0};act(d).forEach(s=>s.pay.forEach(p=>o[p.m]+=p.a));return o}
const egr=d=>r2(d.exp.reduce((a,e)=>a+e.a,0)),exp=d=>r2((+d.open||0)+byM(d).Efectivo-egr(d)),tot=d=>r2(act(d).reduce((a,s)=>a+s.total,0)),ivd=d=>r2(act(d).reduce((a,s)=>a+(s.iva||0),0)),cob=d=>r2(Object.values(byM(d)).reduce((a,b)=>a+b,0));
function agent(n){const d=D[n],a=[],S=act(d),pend=S.filter(s=>s.total-paid(s)>.004);
 if(d.open==="")a.push("Falta registrar el fondo inicial de caja.");
 if(pend.length)a.push(`${pend.length} cobro(s) pendiente(s) por ${q(pend.reduce((x,s)=>x+s.total-paid(s),0))}: ${pend.map(s=>esc(s.cli)).join(", ")}.`);
 const sa=S.filter(s=>ap(s)==="pend");if(sa.length)a.push(`${sa.length} trabajo(s) esperando aprobación del cliente: ${sa.map(s=>esc(s.no)).join(", ")}. No iniciar producción sin aprobación.`);
 const lis=S.filter(s=>s.est==="Listo"&&s.total-paid(s)>.004);if(lis.length)a.push(`Trabajo listo con saldo: no entregar hasta cobrar (${lis.map(s=>esc(s.no)).join(", ")}).`);
 const ref=S.some(s=>s.pay.some(p=>p.m!=="Efectivo"&&!p.ref));if(ref)a.push("Hay pagos sin número de referencia.");
 const av=DAYS.filter(x=>x!==n&&act(D[x]).length).map(x=>tot(D[x]));if(av.length&&S.length){const m=av.reduce((x,y)=>x+y,0)/av.length;if(tot(d)<m*.5)a.push(`Ventas del día por debajo de la mitad del promedio (${q(m)}).`)}
 const an=d.sales.filter(s=>s.void).length;if(an>1)a.push(`${an} ventas anuladas hoy. Revise la bitácora.`);
 if(d.count!==""){const df=r2(d.count-exp(d));a.push(df===0?"Caja cuadrada: el efectivo contado coincide con el esperado.":`Diferencia de ${q(Math.abs(df))} (${df<0?"faltante":"sobrante"}). Revise cobros, egresos y vueltos.`)}
 else if(S.length)a.push("Cuente el efectivo para cerrar el cuadre.");
 if(d.closed)a.unshift("Día cerrado. Solo el administrador puede reabrirlo.");
 return a.length?a:["Registre el fondo inicial para comenzar."]}

 <div class="r">${q(s.total)}<br>${s.void?"":`${pe>.004?`<button class="s bad" ${dis} onclick="cobrar(${i})">Cobrar ${q(pe)}</button>`:`<span class="tag ok">Pagado</span>`}<br><button class="s" style="margin-top:4px" onclick="rec(${i})">Recibo</button>${admin&&!L?` <button class="s" style="margin-top:4px" onclick="anular(${i})">Anular</button>`:""}`}</div></div>`}).join(""):`<p class="mu">Sin ventas. Agregue la primera arriba.</p>`}</section>

function extra(){const rows=[];DAYS.forEach(n=>D[n].sales.forEach((s,i)=>{const pe=r2(s.total-paid(s));if(!s.void&&pe>.004)rows.push({n,s,pe,age:Math.floor((Date.now()-(s.ts||Date.now()))/864e5)})}));
 $("cxc").innerHTML=rows.length?rows.map(r=>`<div class="row"><div><b>${esc(r.s.cli)}</b><div class="mu">${r.n} · ${esc(r.s.no)} · ${r.age>2?`<span class="bad">${r.age} días</span>`:r.age+" días"}</div></div><b>${q(r.pe)}</b></div>`).join("")+`<div class="row"><b>Total por cobrar</b><b>${q(rows.reduce((a,r)=>a+r.pe,0))}</b></div>`:`<p class="mu">Sin saldos pendientes.</p>`;
 let h="<table><tr><th>Día</th><th>Vendido</th><th>IVA</th><th>Cobrado</th><th>Egresos</th><th>Dif. caja</th></tr>",a=0,b=0,c=0;
 DAYS.forEach(n=>{const d=D[n];a+=tot(d);b+=cob(d);c+=egr(d);h+=`<tr><td>${n}${d.closed?" 🔒":""}</td><td>${q(tot(d))}</td><td>${q(ivd(d))}</td><td>${q(cob(d))}</td><td>${q(egr(d))}</td><td>${d.count===""?"—":q(d.count-exp(d))}</td></tr>`});
 let h2="<table style='margin-top:12px'><tr><th>Aprobación del cliente</th><th>Aprobadas</th><th>Pendientes</th></tr>",pa=0,pp=0;DAYS.forEach(n=>{const d=D[n],x=apt(d,"ok"),y=apt(d,"pend");pa+=x;pp+=y;h2+=`<tr><td>${n}</td><td>${q(x)}</td><td class="${y?"bad":""}">${q(y)}</td></tr>`});h2+=`<tr><td><b>Total</b></td><td><b>${q(pa)}</b></td><td><b>${q(pp)}</b></td></tr></table>`;
 $("wk").innerHTML=h+`<tr><td><b>Total</b></td><td><b>${q(a)}</b></td><td><b>${q(DAYS.reduce((x,n)=>x+ivd(D[n]),0))}</b></td><td><b>${q(b)}</b></td><td><b>${q(c)}</b></td><td></td></tr></table>`+h2;
 $("adm").innerHTML=admin?`<h2>Precios (administrador)</h2><div class="g">${SV.map((s,i)=>`<div><label>${s.u==="diseño"?"Diseño gráfico (precio máximo; mínimo Q15)":s.n+" (Q/"+s.u+")"}</label><input type="number" step="0.01" min="0" value="${s.p}" onchange="SV[${i}].p=+this.value;savePrices();draw()"></div>`).join("")}<div><label>Tratamiento del IVA</label><select onchange="IV.mode=this.value;savePrices();draw()"><option value="incluido" ${IV.mode=="incluido"?"selected":""}>Precios incluyen IVA</option><option value="aparte" ${IV.mode=="aparte"?"selected":""}>Agregar IVA al precio</option><option value="sin" ${IV.mode=="sin"?"selected":""}>Sin IVA</option></select></div><div><label>Tasa de IVA (%)</label><input type="number" step="0.5" min="0" value="${IV.r}" onchange="IV.r=+this.value;savePrices();draw()"></div></div>`:"";}
function fld(){const e=$("sv");if(e)$("dim").style.display=SV[+e.value].u==="m²"?"grid":"none"}
function add(){const s=SV[+sv.value],c=+ct.value||1;let sub,t;
 if(s.u==="m²"){const a=+an.value,h=+al.value;if(!(a>0&&h>0))return;const m2=a*h*c;sub=r2(m2*s.p);t=`${s.n}: ${a}×${h} m × ${c} = ${r2(m2)} m²`}else{sub=r2(s.p*c);t=`${s.n} × ${c}`}
 cart.push({t,sub});const k=[cli.value,tel.value,nit.value];draw();cli.value=k[0];tel.value=k[1];nit.value=k[2]}
const quote=()=>{const t="Cotización:\n"+cart.map(l=>`- ${l.t}: ${q(l.sub)}`).join("\n")+`\n${IV.mode==="sin"?"":"IVA "+IV.r+"%: "+q(tx(cart.reduce((a,l)=>a+l.sub,0)).i)+"\n"}Total: ${q(tx(cart.reduce((a,l)=>a+l.sub,0)).t)}`;navigator.clipboard?.writeText(t).then(()=>alert("Cotización copiada"),()=>alert(t))};
function sell(){const d=day();if(lock())return;const X=tx(r2(cart.reduce((a,l)=>a+l.sub,0))),T=X.t,a=Math.min(+pg.value||0,T);
 if(a>0&&mt.value!=="Efectivo"&&!rf.value.trim())return alert("Ingrese el número de referencia del pago.");
 const n=Math.max(0,...DAYS.flatMap(x=>D[x].sales.map(s=>+s.no.slice(-4))))+1;
 const s={no:"R-"+String(n).padStart(4,"0"),cli:cli.value.trim()||"Mostrador",tel:tel.value.trim(),items:cart.map(l=>l.t).join(" · "),total:T,iva:X.i,nit:(nit.value||"CF").trim().toUpperCase(),est:"Recibido",apr:"pend",tok:(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)),ts:Date.now(),pay:a>0?[{m:mt.value,a,ref:rf.value.trim()}]:[]};
 d.sales.push(s);lg(d,`Venta ${s.no} ${q(T)}, cobro ${q(a)}`);cart=[];persist(DAYS[cur]);draw();rec(d.sales.length-1)}
function cobrar(i){if(lock())return;const d=day(),s=d.sales[i],pe=r2(s.total-paid(s)),v=prompt("Monto a cobrar (Q)",pe);if(v===null)return;
 const a=Math.min(+v||0,pe);if(a<=0)return;const mm=M2(prompt("Método: 1 Efectivo, 2 Tarjeta, 3 Transferencia","1"));let ref="";
 if(mm!=="Efectivo"){ref=(prompt("Número de referencia")||"").trim();if(!ref)return alert("La referencia es obligatoria.")}
 s.pay.push({m:mm,a,ref});lg(d,`Cobro ${q(a)} ${mm} a ${s.no}`);persist(DAYS[cur]);draw()}

function est(i,v){const d=day(),s=d.sales[i];if(v!=="Recibido"&&ap(s)!=="ok"){alert("El cliente aún no aprueba este trabajo. Envíe el recibo por WhatsApp y registre su aprobación.");return draw()}if(v==="Entregado"&&s.total-paid(s)>.004){alert("No se puede entregar: tiene saldo pendiente de "+q(s.total-paid(s)));return draw()}
 s.est=v;lg(d,`${s.no} → ${v}`);persist(DAYS[cur]);draw()}

 s.void=w;s.pay.filter(p=>p.m==="Efectivo").forEach(p=>d.exp.push({c:"Devolución "+s.no,a:p.a}));lg(d,`Anulada ${s.no}: ${w}`);persist(DAYS[cur]);draw()}

 if(!confirm(`Cerrar ${DAYS[cur]}? Diferencia: ${q(d.count-exp(d))}. Quedará bloqueado.`))return;d.closed=true;lg(d,`Día cerrado. Diferencia ${q(d.count-exp(d))}`);persist(DAYS[cur]);draw()}

function rec(i){const d=day(),s=d.sales[i];const t=`GRAFICK · Soluciones Publicitarias\n3 CALLE 5-38 EDIFICIO COMUNIDAD, zona 4, CHIMALTENANGO\nWhatsApp 5896-5557 · Tel. 7764-3764\nRecibo ${s.no}${s.void?" (ANULADO)":""}\n${DAYS[cur]} · ${new Date(s.ts||Date.now()).toLocaleDateString("es-GT")}\nCliente: ${s.cli}\nNIT: ${s.nit||"CF"}\n\n${s.items.split(" · ").join("\n")}\n\n${s.iva?`IVA incluido en el total: ${q(s.iva)}\n`:""}Total: ${q(s.total)}\nPagado: ${q(paid(s))}\nSaldo: ${q(s.total-paid(s))}\nEstado: ${s.est}\n${ap(s)==="ok"?"APROBADO por el cliente: "+new Date(s.aprAt||Date.now()).toLocaleString("es-GT")+"\n":ap(s)==="pend"?"\nAPRUEBE SU PEDIDO EN ESTE ENLACE:\n"+(s.tok?location.origin+"/a/"+s.tok:"")+"\n":""}Comprobante interno, no es factura FEL."`;
 window.recI=i;$("cf").style.display=ap(s)==="pend"&&!s.void&&!lock()?"":"none";$("rt").textContent=t;$("wa").style.display="";$("wa").href="https://wa.me/"+(s.tel?"502"+s.tel.replace(/\D/g,""):"")+"?text="+encodeURIComponent(t);$("wa").onclick=()=>{if(!s.sent){s.sent=Date.now();lg(d,`Recibo ${s.no} enviado por WhatsApp`);persist(DAYS[cur])}};$("rc").style.display="flex"}
